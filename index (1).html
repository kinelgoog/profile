<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0812">
<title>Kinel — Designer & Developer</title>

<style>
:root {
    --bg: #0b0812;
    --panel: rgba(25, 18, 38, .64);
    --panel-soft: rgba(255, 255, 255, .055);
    --line: rgba(255, 255, 255, .13);
    --text: #f8f3ff;
    --muted: #aaa0b8;
    --violet: #c084fc;
    --pink: #f0abfc;
    --radius: 30px;
}

* {
    box-sizing: border-box;
}

html {
    min-width: 320px;
    background: var(--bg);
    color-scheme: dark;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
    background:
        radial-gradient(850px 620px at -8% -10%, rgba(126, 34, 206, .30), transparent 68%),
        radial-gradient(700px 560px at 108% 108%, rgba(168, 85, 247, .20), transparent 68%),
        radial-gradient(580px 460px at 74% 28%, rgba(76, 29, 149, .18), transparent 72%),
        var(--bg);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .18;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse at center, black 15%, transparent 78%);
}

a {
    color: inherit;
    text-decoration: none;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.page {
    width: min(1180px, calc(100% - 56px));
    min-height: 100svh;
    margin: 0 auto;
    padding: 28px 0 24px;
    display: flex;
    flex-direction: column;
}

.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.02em;
}

.brand-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    background: linear-gradient(145deg, #d8b4fe, #7c3aed);
    box-shadow:
        0 8px 24px rgba(124,58,237,.32),
        inset 0 1px 0 rgba(255,255,255,.45);
}

.nav-meta {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.nav-meta i,
.availability i {
    width: 7px;
    height: 7px;
    display: inline-block;
    border-radius: 50%;
    background: #c084fc;
    box-shadow: 0 0 14px #c084fc;
}

.hero {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    align-items: stretch;
    gap: 20px;
    padding: clamp(58px, 9vh, 110px) 0;
}

.glass {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border: 1px solid var(--line);
    background:
        linear-gradient(135deg, rgba(255,255,255,.095), transparent 35%),
        var(--panel);
    border-radius: var(--radius);
    box-shadow:
        0 28px 80px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -1px 0 rgba(255,255,255,.035);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
}

.glass::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
        radial-gradient(420px 260px at 100% 0%, rgba(192,132,252,.10), transparent 70%);
}

.profile {
    min-height: 590px;
    padding: clamp(30px, 5vw, 54px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #d8b4fe;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.eyebrow span {
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, #c084fc, transparent);
}

.avatar-shell {
    position: relative;
    width: 124px;
    height: 124px;
    margin: 42px 0 32px;
}

.avatar-shell::before {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid rgba(216,180,254,.34);
    border-radius: 39px;
    transform: rotate(7deg);
}

.avatar-shell::after {
    content: "";
    position: absolute;
    right: -5px;
    bottom: -4px;
    width: 15px;
    height: 15px;
    border: 3px solid #171020;
    border-radius: 50%;
    background: #c084fc;
    box-shadow: 0 0 18px rgba(192,132,252,.9);
}

.avatar {
    position: relative;
    width: 124px;
    height: 124px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 34px;
    color: #fff;
    font-size: 47px;
    font-weight: 800;
    background: linear-gradient(145deg, #d8b4fe 0%, #8b5cf6 48%, #4c1d95 100%);
    box-shadow:
        0 18px 42px rgba(91,33,182,.38),
        inset 0 1px 0 rgba(255,255,255,.42);
}

.avatar span {
    position: relative;
    z-index: 0;
}

.avatar img {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.24), transparent 35%);
}

h1 {
    max-width: 100%;
    margin: 0;
    font-size: clamp(4rem, 8vw, 6.9rem);
    line-height: .82;
    letter-spacing: -.085em;
    font-weight: 800;
    background: linear-gradient(120deg, #fff 8%, #f5d0fe 48%, #c4b5fd 92%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.role {
    margin: 25px 0 0;
    color: #eee5f7;
    font-size: clamp(18px, 2vw, 22px);
    letter-spacing: -.03em;
}

.description {
    max-width: 390px;
    margin: 15px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.65;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 30px;
}

.tag {
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.105);
    border-radius: 999px;
    color: #d9c9e9;
    font-size: 11px;
    letter-spacing: .05em;
    text-transform: uppercase;
    background: rgba(255,255,255,.045);
}

.profile-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-top: 42px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.10);
    color: var(--muted);
    font-size: 12px;
}

.availability {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.index {
    color: #867b95;
    font-variant-numeric: tabular-nums;
}

.links-panel {
    min-height: 590px;
    padding: 26px;
    display: flex;
    flex-direction: column;
}

.links-heading {
    padding: 15px 15px 28px;
}

.section-label {
    color: #bd9be2;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.links-heading h2 {
    margin: 13px 0 9px;
    font-size: clamp(29px, 4vw, 43px);
    line-height: 1;
    letter-spacing: -.065em;
}

.links-heading p {
    max-width: 370px;
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

.social-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: auto;
}

.social {
    --accent: #c4b5fd;
    position: relative;
    min-height: 174px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.105);
    border-radius: 23px;
    background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    transition:
        transform .28s ease,
        border-color .28s ease,
        background .28s ease,
        box-shadow .28s ease;
}

.social::before {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    right: -95px;
    bottom: -105px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .10;
    filter: blur(24px);
    pointer-events: none;
}

.social:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 58%, transparent);
    background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
    box-shadow:
        0 16px 34px rgba(0,0,0,.22),
        0 0 28px color-mix(in srgb, var(--accent) 14%, transparent);
}

.social:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.social-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
}

.social-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    color: var(--accent);
    background: rgba(255,255,255,.065);
}

.social-icon svg {
    width: 21px;
    height: 21px;
}

.arrow {
    color: #8f839d;
    font-size: 21px;
    line-height: 1;
    transition: color .28s ease, transform .28s ease;
}

.social:hover .arrow {
    color: var(--accent);
    transform: translate(2px, -2px);
}

.social strong {
    position: relative;
    display: block;
    margin-bottom: 7px;
    color: #f4edf9;
    font-size: 16px;
    letter-spacing: -.025em;
}

.social small {
    position: relative;
    display: block;
    overflow: hidden;
    color: #93889e;
    font-size: 11px;
    line-height: 1.4;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.github { --accent: #c4b5fd; }
.telegram { --accent: #7dd3fc; }
.steam { --accent: #a5b4fc; }
.spotify { --accent: #86efac; }

.footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    color: #81768c;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.footer-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.10);
}

@supports not ((backdrop-filter: blur(1px))) {
    .glass {
        background: #191226;
    }
}

@media (max-width: 900px) {
    .hero {
        grid-template-columns: 1fr;
        padding: 52px 0;
    }

    .profile,
    .links-panel {
        min-height: auto;
    }

    .profile {
        padding-bottom: 38px;
    }

    .links-panel {
        padding-top: 24px;
    }
}

@media (max-width: 560px) {
    .page {
        width: min(100% - 28px, 480px);
        padding-top: 18px;
    }

    .nav-meta {
        display: none;
    }

    .hero {
        gap: 14px;
        padding: 38px 0 28px;
    }

    .profile,
    .links-panel {
        border-radius: 25px;
    }

    .profile {
        padding: 26px;
    }

    .avatar-shell {
        width: 102px;
        height: 102px;
        margin: 34px 0 27px;
    }

    .avatar {
        width: 102px;
        height: 102px;
        border-radius: 29px;
        font-size: 38px;
    }

    h1 {
        font-size: clamp(3.8rem, 20vw, 5rem);
    }

    .profile-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
    }

    .links-panel {
        padding: 17px;
    }

    .links-heading {
        padding: 12px 10px 22px;
    }

    .social-grid {
        grid-template-columns: 1fr;
    }

    .social {
        min-height: 142px;
    }

    .footer-line {
        display: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
