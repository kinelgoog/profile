:root{

.wrap{

margin:0 auto;min-height:100svh;
display:flex;flex-direction:column;
position:relative;z-index:2;
}
.cur{
position:fixed;left:0;top:0;z-index:9999;pointer-events:none;
width:22px;height:22px;margin:-11px 0 0 -11px;
border:1px solid transparent;border-radius:50%;
opacity:0;will-change:transform;
transition:opacity .25s,border-color .3s,width .28s var(--spring),height .28s var(--spring),margin .28s var(--spring);
}
.cur::before,.cur::after{
content:"";position:absolute;background:var(--v1);
transition:opacity .25s;
}
.cur::before{left:50%;top:0;width:1px;height:100%}
.cur::after{top:50%;left:0;height:1px;width:100%}
.cur.hov{width:40px;height:40px;margin:-20px 0 0 -20px;border-color:var(--v1)}
.cur.hov::before,.cur.hov::after{opacity:0}
@media(pointer:fine){body.has-cur .cur{opacity:.8}}
@media(pointer:coarse){.cur{display:none}}
.bar{

animation:rise .9s var(--ease) .15s forwards;
}
.brand{

}

display:block;transition:transform .5s var(--spring);
}
.brand:hover i{transform:scale(1.35) rotate(45deg)}
.tm{

}

.meta{

}
.meta div{font-size:13.5px;color:var(--faint)}
.meta b{display:block;color:var(--sub);font-weight:500;margin-top:3px}
.links{

}
.links ul{list-style:none;display:flex;flex-direction:column}

transition:padding .35s var(--ease),background .35s;
}
